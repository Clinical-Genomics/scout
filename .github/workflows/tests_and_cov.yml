name: Run tests and push coverage to Codecov

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: uv sync --frozen --all-extras --dev

  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
        mongodb-version: ['7']
    steps:
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@v1
        with:
         mongodb-version: ${{ matrix.mongodb-version }}

      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install the HTML 2 PDF renderer
        run: sudo apt-get update || true && sudo apt-get install -y wkhtmltopdf

      - name: Run pytest
        run: uv run --frozen --dev pytest --cov --test-group-count 8 --test-group=${{ matrix.group }} --test-group-random-seed=12345 --rootdir=/home/runner/work/scout

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage${{ matrix.group }}
          path: .coverage
          include-hidden-files: true

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Download all artifacts
        uses: actions/download-artifact@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Run coverage
        run: |
          uv run --frozen --dev coverage combine coverage*/.coverage*
          uv run --no-build --frozen --dev coverage report
          uv run --no-build --frozen --dev coverage xml
      - uses: codecov/codecov-action@v7
        env:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
