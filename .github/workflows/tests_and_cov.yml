name: Run tests and push coverage to Codecov

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

env:
  WKHTMLTOPDF_CACHE_VERSION: v0.12.6.1-resolute

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache wkhtmltopdf
        id: wkhtmltopdf-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/wkhtmltopdf
          key: ${{ runner.os }}-wkhtmltopdf-${{ env.WKHTMLTOPDF_CACHE_VERSION }}

      - name: Download wkhtmltopdf
        if: steps.wkhtmltopdf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/wkhtmltopdf
          curl -fL https://github.com/newinnovations/wkhtml-packaging/releases/download/2026-05-06/wkhtmltopdf_0.12.6.1-resolute_amd64 \
            -o ~/.cache/wkhtmltopdf/wkhtmltopdf
          echo "17537866fbbeb121d2f03a297a47a25d1369a348bd5142e5b15ccce7174201e0  $HOME/.cache/wkhtmltopdf/wkhtmltopdf" | sha256sum -c
          chmod +x ~/.cache/wkhtmltopdf/wkhtmltopdf

  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
        mongodb-version: ['7']
    steps:
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@v1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Restore wkhtmltopdf cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/wkhtmltopdf
          key: ${{ runner.os }}-wkhtmltopdf-${{ env.WKHTMLTOPDF_CACHE_VERSION }}

      - name: Install the HTML 2 PDF renderer
        run: |
          sudo install -m 755 ~/.cache/wkhtmltopdf/wkhtmltopdf /usr/local/bin/wkhtmltopdf
          wkhtmltopdf --version

      - name: Run pytest
        run: uv run --frozen --dev pytest --cov --test-group-count 8 --test-group=${{ matrix.group }} --test-group-random-seed=12345 --rootdir=/home/runner/work/scout

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage${{ matrix.group }}
          path: .coverage
          include-hidden-files: true

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Download all artifacts
        uses: actions/download-artifact@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Run coverage
        run: |
          uv run --frozen --dev coverage combine coverage*/.coverage*
          uv run --frozen --dev coverage report
          uv run --frozen --dev coverage xml

      - uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
