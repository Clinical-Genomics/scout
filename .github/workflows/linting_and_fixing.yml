name: Lint files and fix lint errors

# This will only correct linting in local PRs
on: ["push"]

jobs:
  build:

    name: Lint-and-fix
    runs-on: ubuntu-latest

    steps:

    # Check out Scout code
    - name: Check out git repository
      uses: actions/checkout@v7

    # Set up python
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: ".python-version"

    - name: Set up UV
      uses: astral-sh/setup-uv@v9.0.0

    - name: Install Python Dependencies
      run: |
        uv pip install --no-build --binary-only :all: --group lint

    - name: Run linters
      uses: wearerequired/lint-action@v3
      # Let linters fix problems if they can
      with:
        github_token: ${{ secrets.github_token }}
        auto_fix: true
        # Enable linters
        black: true
        black_args: "-l 100"
        # stop the build if there are Python syntax errors or undefined names
        flake8: true
        flake8_args: "scout/ --count --select=E9,F63,F7,F82 --max-line-length 100 --show-source --statistics"
