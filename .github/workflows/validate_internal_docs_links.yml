name: Validate internal documentation links

"on": [pull_request]

jobs:
    tests:
        name: Zensical build strict
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v9.0.0
            - name: Build docs in strict mode
              run: uv run --frozen --no-build --only-group docs zensical build --strict
